# 在线供应商覆盖配置模板（TASK.PROVIDER.01）
#
# 复制到 config/providers.local.yaml 后编辑；该文件已在 .gitignore，
# 永远不要把真实端点/密钥提交到 Gitee。
#
# 优先级：环境变量 > providers.local.yaml > inference.yaml
# 密钥只放仓库根目录 .env（同样 gitignored）。

# LLM：local = 本地 llama-server :8080；openai_compat = 任意 OpenAI 兼容 API
llm:
  provider: openai_compat
  openai_compat:
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4.1-flash
    # key 从 .env 的 WAFER_LLM_API_KEY 读取；不要写在这里
    timeout: 60

# TTS：local 默认 GPT-SoVITS；minimax = MiniMax T2A v2
tts:
  provider: minimax
  minimax:
    model: speech-2.8-hd
    voice_id: Chinese_crisp_podcaster_nv1
    # endpoint: https://api.minimax.cn/v1/t2a_v2
    # key 从 .env 的 MINIMAX_API_KEY 读取；旧账号如需分组填 MINIMAX_GROUP_ID
    sample_rate: 32000
    format: wav
    timeout: 60
